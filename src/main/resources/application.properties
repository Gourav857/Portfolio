spring.application.name=developer-portfolio

# Render dynamically assigns a port, so we use ${PORT:8080}
server.port=${PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Production (Render) par HTTPS use hota hai, isliye ise true rakhna behtar hai agar HTTPS par chal raha ho
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# Render MySQL Database Configuration (Environment variables se automatically uthayega)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gourav.jv9588}
spring.sql.init.mode=always

portfolio.admin.username=Gourav
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD:gourav.jv9588}

# Resend Mail Configuration (Render environment variables se connect hoga)
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:enter-here-resend-api-key}
resend.from-email=onboarding@resend.dev
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.quitwait=false
spring.mail.test-connection=false

spring.jackson.deserialization.fail-on-unknown-properties=true
portfolio.contact.recipient=gourav.jv9588@gmail.com
portfolio.contact.sender=${RESEND_FROM_EMAIL:${resend.from-email}}
